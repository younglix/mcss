name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # The EC2_* names are historical (the app started on AWS EC2); they
          # now hold the Contabo server's address, the "mcss" user and its
          # deploy key. See deploy/README.md.
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          # The key's authorized_keys entry on the server has a forced
          # command (command="/usr/local/bin/mcss-deploy") — whatever is sent
          # here is ignored server-side and the deploy runs instead. This is
          # just a label for the Actions log; the real deploy output streams
          # back over the same SSH session regardless.
          script: echo "invoking forced deploy command on the server"
