# Mount Carmel ERP: installed to /etc/nginx/sites-available/mcss by
# deploy/setup-server.sh. Plain HTTP on any host name / bare IP for now.
# When the domain is ready, `certbot --nginx -d <domain>` adds the HTTPS
# server block to this same file.

upstream mcss_app {
    server 127.0.0.1:8000;   # mcss-daphne
}

map $http_upgrade $mcss_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The largest upload the app accepts is 15 MB (HR documents, resources).
    client_max_body_size 20m;

    root /srv/mcss/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://mcss_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report-card / receipt PDFs can take a while to render.
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://mcss_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://mcss_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcss_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Django admin's own CSS/JS (collectstatic).
    location /static/ {
        alias /srv/mcss/backend/staticfiles/;
        expires 7d;
    }

    # Only for any upload saved before cloud storage was configured.
    location /media/ {
        alias /srv/mcss/backend/media/;
    }

    # The service worker must never be cached, or app updates get stuck.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite's hashed bundles never change once built.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is a frontend route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
